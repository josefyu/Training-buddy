<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Buddy</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1b1f24; --muted:#6b7280; --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --fg:#e8eaed; --muted:#9aa0a6; --accent:#60a5fa; --ok:#4ade80; --warn:#fbbf24; --line:#2a2f37; }
  }
  * { box-sizing:border-box }
  body { margin:0; font:16px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:640px; margin:0 auto; padding:16px }
  h1 { font-size:1.3rem; margin:0 0 12px }
  h2 { font-size:1.05rem; margin:0 0 8px }
  nav { display:flex; gap:8px; margin-bottom:16px }
  nav button { flex:1; padding:9px 4px; font-size:.85rem }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px }
  label { display:block; font-size:.85rem; color:var(--muted); margin:8px 0 2px }
  input, select, textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit }
  button { padding:9px 14px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font:inherit; cursor:pointer }
  button.primary, nav button.active { background:var(--accent); border-color:var(--accent); color:#fff }
  .row { display:flex; gap:8px } .row > * { flex:1 }
  .ex { display:grid; grid-template-columns:2fr 1fr 1fr 1fr auto; gap:6px; margin-bottom:6px }
  .muted { color:var(--muted); font-size:.9rem }
  .ok { color:var(--ok) } .warn { color:var(--warn) }
  .stat { font-size:1.4rem; font-weight:600 }
  ul { margin:6px 0; padding-left:20px }
  .entry { border-top:1px solid var(--line); padding:8px 0 } .entry:first-of-type { border-top:0 }
  .hidden { display:none }
  .clock { font-size:4.5rem; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; margin:4px 0 }
  .runname { font-size:1.6rem; font-weight:700; text-align:center; margin-top:6px }
  .bar { height:10px; background:var(--line); border-radius:6px; overflow:hidden; margin:6px 0 }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .25s linear }
  .run-work { border-color:var(--ok) } .run-rest { border-color:var(--accent) }
  .dial { display:block; width:min(78vw,300px); margin:6px auto }
  .dial .face { fill:var(--card); stroke:var(--line); stroke-width:3 }
  .dial .track { fill:none; stroke:var(--line); stroke-width:8 }
  .dial .arc { fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transform:rotate(-90deg); transform-origin:100px 100px }
  .dial.work .arc, .dial.work .hand { stroke:var(--ok) } .dial.work .hub { fill:var(--ok) }
  .dial .tick { stroke:var(--muted); stroke-width:1.5 } .dial .tick.big { stroke:var(--fg); stroke-width:2.5 }
  .dial .num { fill:var(--muted); font-size:10px; text-anchor:middle; dominant-baseline:central }
  .dial .hand { stroke:var(--accent); stroke-width:3; stroke-linecap:round }
  .dial .hub { fill:var(--accent) }
  .dial .digi { fill:var(--fg); font-size:26px; font-weight:700; text-anchor:middle; font-variant-numeric:tabular-nums }
  .run button { padding:14px 8px }
</style>
</head>
<body>
<main>
  <h1>🏃 Training Buddy</h1>
  <nav>
    <button data-tab="trainer">Trainer</button>
    <button data-tab="food">Essen</button>
    <button data-tab="log">Log</button>
    <button data-tab="week">Woche</button>
    <button data-tab="profile">Ziele</button>
  </nav>
  <div id="view"></div>
</main>

<script>
// ---------- Storage ----------
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let profile = store.get('tb_profile', null);   // {freq, focus, overload, back}
let workouts = store.get('tb_workouts', []);   // [{id,date,type,minutes,kcal,exercises:[{name,sets,reps,weight}],note}]
let foods = store.get('tb_foods', []);        // [{id,date,name,kcal,protein}]
const save = () => { store.set('tb_profile', profile); store.set('tb_workouts', workouts); store.set('tb_foods', foods); };
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {} // Browser soll Daten nicht von selbst löschen

// ---------- Helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
const today = () => iso(new Date());
const weekStart = d => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };
const addDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return iso(x); };
const inWeek = (w, ws) => w.date >= ws && w.date <= addDays(ws, 6);
const FOCUS = { ausdauer: 'Ausdauer', kraft: 'Kraft', fitness: 'Allgemeine Fitness' };
const BACK_RE = /plank|unterarmstütz|bird.?dog|dead.?bug|rudern|row|good.?morning|kreuzheben|deadlift|brücke|bridge|superman|hyperext|rückenstreck|face.?pull|latzug|lat.?pull|klimmzug|pull.?up|seitstütz|hip.?thrust|glute|reverse.?fly|rückenstrecker/i;
const NECK_RE = /kinn einziehen|chin.?tuck|schulterblatt|wall.?angel|prone.?y|nackendehnung|brustdehnung|face.?pull|reverse.?fly|rudern|row|latzug|lat.?pull/i;
const vol = e => (+e.sets || 0) * (+e.reps || 0) * (+e.weight || 1); // Körpergewicht zählt als 1
const sets = e => +e.sets || 0;

// ---------- Views ----------
function render(tab) {
  tab = profile ? (tab || location.hash.slice(1) || 'trainer') : 'profile';
  location.hash = tab;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('#view').innerHTML = '';
  ({ trainer: viewTrainer, food: viewFood, log: viewLog, week: viewWeek, profile: viewProfile }[tab] || viewTrainer)();
}

function viewProfile() {
  const p = profile || { freq: 3, focus: 'fitness', overload: true, back: true, neck: true };
  $('#view').innerHTML = `
  <div class="card">
    <h2>${profile ? 'Deine Ziele' : 'Willkommen! Erzähl mir von deinem Training'}</h2>
    <label>Wie oft pro Woche willst du trainieren?</label>
    <select id="freq">${[1,2,3,4,5,6,7].map(n => `<option ${n==p.freq?'selected':''}>${n}</option>`).join('')}</select>
    <label>Was ist dein Fokus?</label>
    <select id="focus">${Object.entries(FOCUS).map(([k,v]) => `<option value="${k}" ${k==p.focus?'selected':''}>${v}</option>`).join('')}</select>
    <label>Progressive Overload (Belastung langsam steigern)</label>
    <select id="overload"><option value="1" ${p.overload?'selected':''}>Ja, bitte tracken</option><option value="0" ${!p.overload?'selected':''}>Nein</option></select>
    <label>Rückenschmerzen vorbeugen</label>
    <select id="back"><option value="1" ${p.back?'selected':''}>Ja, bitte berücksichtigen</option><option value="0" ${!p.back?'selected':''}>Nein</option></select>
    <label>Nackenschmerzen vorbeugen</label>
    <select id="neck"><option value="1" ${p.neck?'selected':''}>Ja, bitte berücksichtigen</option><option value="0" ${!p.neck?'selected':''}>Nein</option></select>
    <p><button class="primary" id="saveP">Speichern</button></p>
  </div>
  <div class="card"><h2>Daten</h2>
    <p class="muted">Deine Daten liegen <b>nur in diesem Browser auf diesem Gerät</b> – nicht auf GitHub und nicht in der Cloud. Sichere sie regelmäßig: Export speichert eine Datei (am iPhone in „Dateien“/iCloud), Import lädt sie wieder, z.B. auf einem neuen Handy.<br>Letztes Backup: ${(store.get('tb_meta', {}).lastBackup) || 'noch nie'}</p>
    <button id="exp">Export (JSON)</button>
    <button id="imp">Import</button>
  </div>`;
  $('#saveP').onclick = () => {
    profile = { freq: +$('#freq').value, focus: $('#focus').value, overload: $('#overload').value === '1', back: $('#back').value === '1', neck: $('#neck').value === '1' };
    save(); render('trainer');
  };
  $('#exp').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ profile, workouts, foods, trainer: TR }, null, 2)], { type: 'application/json' }));
    a.download = 'training-buddy.json'; a.click(); store.set('tb_meta', { lastBackup: today() }); setTimeout(() => viewProfile(), 300);
  };
  $('#imp').onclick = () => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = '.json';
    i.onchange = async () => {
      try { const d = JSON.parse(await i.files[0].text()); profile = d.profile; workouts = d.workouts || []; foods = d.foods || []; if (d.trainer) { Object.assign(TR, d.trainer); saveTR(); } save(); render('log'); }
      catch { alert('Datei konnte nicht gelesen werden.'); }
    };
    i.click();
  };
}

function exRow(e = {}) {
  const r = document.createElement('div'); r.className = 'ex';
  r.innerHTML = `<input placeholder="Übung" value="${esc(e.name)}" list="exlist">
    <input type="number" min="0" placeholder="Sätze" value="${esc(e.sets)}">
    <input type="number" min="0" placeholder="Wdh." value="${esc(e.reps)}">
    <input type="number" min="0" step="0.5" placeholder="kg" value="${esc(e.weight)}">
    <button type="button" title="Entfernen">✕</button>`;
  r.lastElementChild.onclick = () => r.remove();
  return r;
}

function viewLog() {
  const names = [...new Set(workouts.flatMap(w => (w.exercises || []).map(e => e.name)))];
  $('#view').innerHTML = `
  <div class="card">
    <h2>💡 Vorschlag: Rücken-Einstieg (2× pro Woche)</h2>
    <ul class="muted">
      <li>Rudergerät 3×12 · Latzug 3×12 · Rückenstrecker 2×12</li>
      <li>Beinpresse 3×12 · Plank 3×30 s · Bird Dog 2×8/Seite</li>
      <li>Schultergerät 2×12 als Ergänzung</li>
    </ul>
    <div class="muted">Starte so leicht, dass 2–3 Wdh. übrig bleiben. Nächste Woche: +1 Wdh. oder +2,5 kg.</div>
  </div>
  <div class="card" id="sundayBanner"></div>
  <div class="card">
    <h2>Training erfassen</h2>
    <div class="row">
      <div><label>Datum</label><input type="date" id="date" value="${today()}"></div>
      <div><label>Art</label><select id="type"><option value="cardio">Ausdauer (z.B. Laufen)</option><option value="kraft">Kraft / Reps</option><option value="mix">Beides</option></select></div>
    </div>
    <div class="row" id="cardioBox">
      <div><label>Dauer (min)</label><input type="number" id="minutes" min="0" placeholder="30"></div>
      <div><label>Kalorien (kcal)</label><input type="number" id="kcal" min="0" placeholder="250"></div>
    </div>
    <div id="kraftBox" class="hidden">
      <label>Übungen (Sätze × Wdh. × kg; kg leer = Körpergewicht)</label>
      <div id="exs"></div>
      <button type="button" id="addEx">+ Übung</button>
      <datalist id="exlist">${names.map(n => `<option value="${esc(n)}">`).join('')}<option value="Rudergerät"><option value="Latzug"><option value="Rückenstrecker"><option value="Reverse Fly"><option value="Beinpresse"><option value="Plank"><option value="Bird Dog"><option value="Dead Bug"><option value="Glute Bridge"><option value="Hip Thrust"><option value="Schulterdrücken (Gerät)"><option value="Kniebeuge"><option value="Liegestütz"><option value="Kinn einziehen"><option value="Schulterblatt-Rückzug"><option value="Wall Angels"><option value="Prone Y"></datalist>
    </div>
    <label>Notiz (z.B. Rücken, Energie)</label><input id="note">
    <p><button class="primary" id="add">Speichern</button></p>
  </div>
  <div class="card"><h2>Letzte Einheiten</h2><div id="list"></div></div>`;

  const sync = () => {
    const t = $('#type').value;
    $('#cardioBox').classList.toggle('hidden', t === 'kraft');
    $('#kraftBox').classList.toggle('hidden', t === 'cardio');
    if (t !== 'cardio' && !$('#exs').children.length) $('#exs').append(exRow());
  };
  $('#type').onchange = sync; sync();
  $('#addEx').onclick = () => $('#exs').append(exRow());
  $('#add').onclick = () => {
    const type = $('#type').value;
    const exercises = type === 'cardio' ? [] : [...$('#exs').children].map(r => {
      const [n, s, re, k] = [...r.querySelectorAll('input')].map(i => i.value);
      return { name: n.trim(), sets: +s, reps: +re, weight: +k || 0 };
    }).filter(e => e.name && e.sets && e.reps);
    const w = { id: Date.now(), date: $('#date').value, type, minutes: +$('#minutes').value || 0, kcal: +$('#kcal').value || 0, exercises, note: $('#note').value.trim() };
    if (!w.minutes && !w.kcal && !exercises.length) return alert('Bitte Dauer/Kalorien oder mindestens eine Übung angeben.');
    workouts.push(w); save(); render('log');
  };

  const list = [...workouts].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 15);
  $('#list').innerHTML = list.length ? list.map(w => `<div class="entry"><b>${w.date}</b> ${w.minutes ? `· ${w.minutes} min` : ''} ${w.kcal ? `· ${w.kcal} kcal` : ''}
    ${w.exercises?.length ? `<div class="muted">${w.exercises.map(e => `${esc(e.name)} ${e.sets}×${e.reps}${e.unit === 's' ? ' s' : ''}${e.weight ? ' @' + e.weight + 'kg' : ''}`).join(', ')}</div>` : ''}
    ${w.note ? `<div class="muted">📝 ${esc(w.note)}</div>` : ''}
    <button data-del="${w.id}" style="float:right;margin-top:-28px">🗑</button></div>`).join('') : '<p class="muted">Noch nichts erfasst.</p>';
  $('#list').onclick = ev => { const id = ev.target.dataset.del; if (id && confirm('Eintrag löschen?')) { workouts = workouts.filter(w => w.id != id); save(); render('log'); } };

  const isSunday = new Date().getDay() === 0;
  $('#sundayBanner').innerHTML = isSunday
    ? `<h2>📊 Es ist Sonntag – Zeit für deine Wochenanalyse</h2><button class="primary" onclick="render('week')">Analyse öffnen</button>`
    : `<h2>Hallo! 👋</h2><div class="muted">Ziel: ${profile.freq}× pro Woche · Fokus ${FOCUS[profile.focus]}. Jeden Sonntag gibt's deine Wochenanalyse.</div>`;
}

// ---------- Analysis ----------
function analyse(ws) {
  const cur = workouts.filter(w => inWeek(w, ws));
  const prev = workouts.filter(w => inWeek(w, addDays(ws, -7)));
  const sum = (arr, f) => arr.reduce((a, w) => a + f(w), 0);
  const exs = arr => arr.flatMap(w => w.exercises || []);
  const days = new Set(cur.map(w => w.date)).size;
  const cardioMin = sum(cur.filter(w => w.type !== 'kraft'), w => w.minutes), kcal = sum(cur, w => w.kcal);
  const volCur = sum(exs(cur).map(e => ({ v: vol(e) })), x => x.v), volPrev = sum(exs(prev).map(e => ({ v: vol(e) })), x => x.v);
  const setsCur = sum(exs(cur).map(e => ({ v: sets(e) })), x => x.v), setsPrev = sum(exs(prev).map(e => ({ v: sets(e) })), x => x.v);
  const backSets = sum(exs(cur).filter(e => BACK_RE.test(e.name)).map(e => ({ v: sets(e) })), x => x.v);
  const neckDays = new Set(cur.filter(w => (w.exercises || []).some(e => NECK_RE.test(e.name))).map(w => w.date)).size;
  const backDays = new Set(cur.filter(w => (w.exercises || []).some(e => BACK_RE.test(e.name))).map(w => w.date)).size;

  // per-exercise progression vs. last week (best set weight, else total reps)
  const best = arr => { const m = {}; exs(arr).forEach(e => { const k = e.name.toLowerCase(); const o = m[k] ||= { name: e.name, w: 0, reps: 0, unit: e.unit }; o.w = Math.max(o.w, e.weight || 0); o.reps = Math.max(o.reps, (e.sets || 0) * (e.reps || 0)); }); return m; };
  const bc = best(cur), bp = best(prev);
  const prog = Object.entries(bc).filter(([k]) => bp[k]).map(([k, c]) => {
    const p = bp[k];
    const up = c.w > p.w || (c.w === p.w && c.reps > p.reps);
    const down = c.w < p.w || (c.w === p.w && c.reps < p.reps);
    return { name: c.name, state: up ? 'up' : down ? 'down' : 'same', txt: c.w || p.w ? `${p.w}→${c.w} kg` : `${p.reps}→${c.reps} ${c.unit === 's' ? 's' : 'Wdh.'}` };
  });

  const tips = [];
  if (!cur.length) tips.push('Diese Woche wurde nichts erfasst. Schon 20 Minuten Bewegung zählen – plane die nächste Einheit gleich fest ein.');
  else if (days < profile.freq) tips.push(`Du hast ${days} von ${profile.freq} geplanten Einheiten geschafft. Lege nächste Woche feste Tage fest (z.B. ${profile.freq} Termine im Kalender).`);
  else tips.push(`Zielfrequenz erreicht (${days}/${profile.freq}) – stark!`);
  if (cardioMin && cardioMin < 150 && profile.focus !== 'kraft') tips.push(`Ausdauer: ${cardioMin} min. Die WHO empfiehlt ≥150 min moderate Aktivität pro Woche – steigere um ca. 10 % pro Woche, nicht schneller.`);
  if (profile.overload) {
    if (volPrev && volCur) { const d = Math.round((volCur / volPrev - 1) * 100); tips.push(`Krafttraining-Volumen ${d >= 0 ? '+' : ''}${d} % ggü. Vorwoche. ${d < 0 ? 'Nächste Woche pro Übung +1 Wdh. oder +2,5 kg versuchen.' : d > 15 ? 'Das ist ein großer Sprung – steigere lieber um 5–10 %, um Verletzungen zu vermeiden.' : 'Gute, nachhaltige Steigerung.'}` ); }
    else if (setsCur && !setsPrev) tips.push('Das ist deine Basiswoche für Kraft – nächste Woche versuchen wir pro Übung +1 Wdh. oder +2,5 kg (Progressive Overload).');
    else if (!setsCur) tips.push('Kein Krafttraining erfasst – für Progressive Overload brauchen wir Sätze × Wdh. × kg.');
  }
  if (profile.back) {
    if (backDays >= 2) tips.push(`Rücken: ${backSets} Sätze an ${backDays} Tagen für Rücken/Core – genau richtig als Prävention.`);
    else tips.push(`Rücken: nur ${backSets} Sätze an ${backDays} Tag(en). Ziel: 2×/Woche je 2–3 Übungen, z.B. Bird Dog, Plank, Glute Bridge, Rudern (je 2–3 Sätze, ruhig und kontrolliert). Beim Laufen: auf Rumpfspannung und lockere Hüfte achten.`);
    tips.push('Bei anhaltenden oder ausstrahlenden Schmerzen, Taubheit oder Schwäche bitte ärztlich abklären lassen.');
  }
  if (profile.neck) {
    if (neckDays >= 3) tips.push(`Nacken: an ${neckDays} Tagen Schulterblatt-/Nackenübungen – so hält sich der Nacken locker.`);
    else tips.push(`Nacken: nur ${neckDays} Tag(e) mit Nacken-/Schulterblatt-Übungen. Ziel: 3–4× pro Woche die 5-Minuten-Einheit „Nacken & Haltung“ im Trainer, am besten an Bürotagen. Dazu: Bildschirm auf Augenhöhe und etwa stündlich die Haltung wechseln.`);
    tips.push('Bei Ausstrahlung in Arm oder Hand, Kribbeln, Taubheit, Schwindel oder starken Kopfschmerzen bitte ärztlich abklären lassen.');
  }
  const fd = [...new Set(foods.filter(f => f.date >= ws && f.date <= addDays(ws, 6)).map(f => f.date))];
  if (hasBody() && fd.length >= 3) {
    const avgE = Math.round(fd.reduce((a, d) => a + sumF(eatenOn(d), 'kcal'), 0) / fd.length), avgB = Math.round(fd.reduce((a, d) => a + dayBudget(d), 0) / fd.length);
    const diff = avgE - avgB;
    tips.push(`Ernährung (${fd.length} Tage erfasst): Ø ${avgE} kcal bei einem Budget von Ø ${avgB}. ${Math.abs(diff) <= 150 ? 'Das passt gut zu deinem Ziel.' : diff > 0 ? `Du liegst ${diff} kcal drüber${profile.goal === 'bulk' ? ' – für Muskelaufbau ok, wenn du dabei Kraft steigerst.' : '.'}` : `Du liegst ${-diff} kcal drunter${profile.goal === 'cut' ? ' – solange du dich fit fühlst, ist das beim Abnehmen ok.' : ' – iss genug, damit Training und Erholung klappen.'}`}`);
  } else if (hasBody()) tips.push('Ernährung: Trag an mindestens 3 Tagen pro Woche ein, was du isst – dann kann ich Budget und Realität vergleichen.');
  return { cur, days, cardioMin, kcal, volCur, volPrev, setsCur, backSets, backDays, prog, tips };
}

function viewWeek() {
  let ws = weekStart(today());
  const draw = () => {
    const a = analyse(ws);
    $('#view').innerHTML = `
    <div class="card">
      <div class="row"><button id="prev">←</button><div style="text-align:center;flex:3"><b>${ws} – ${addDays(ws, 6)}</b></div><button id="next">→</button></div>
    </div>
    <div class="card"><div class="row">
      <div><div class="stat">${a.days}/${profile.freq}</div><div class="muted">Trainingstage</div></div>
      <div><div class="stat">${a.cardioMin}</div><div class="muted">Ausdauer (min)</div></div>
      <div><div class="stat">${a.kcal}</div><div class="muted">kcal</div></div>
      <div><div class="stat">${a.setsCur}</div><div class="muted">Kraft-Sätze</div></div>
    </div></div>
    ${a.prog.length ? `<div class="card"><h2>Progression ggü. Vorwoche</h2><ul>${a.prog.map(p => `<li>${esc(p.name)}: <span class="${p.state === 'up' ? 'ok' : p.state === 'down' ? 'warn' : 'muted'}">${p.state === 'up' ? '▲' : p.state === 'down' ? '▼' : '＝'} ${p.txt}</span></li>`).join('')}</ul></div>` : ''}
    <div class="card"><h2>Dein Buddy sagt</h2><ul>${a.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
    $('#prev').onclick = () => { ws = addDays(ws, -7); draw(); };
    $('#next').onclick = () => { ws = addDays(ws, 7); draw(); };
  };
  draw();
}

// ---------- Trainer (Timer-gestütztes Training ohne Geräte) ----------
const TR = Object.assign({ lv: { home: 0, run: 0 }, streak: { home: 0, run: 0 }, sessions: 0, mode: 'home', size: 1 }, store.get('tb_trainer', {}));
const saveTR = () => store.set('tb_trainer', TR);
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const SIZES = ['Kurz', 'Mittel', 'Lang'];
const EX = {
  kniebeuge:   { name: 'Kniebeuge', cat: 'legs', cue: 'Füße schulterbreit, Brust hoch, Gesäß nach hinten unten, Knie zeigen über die Zehen.' },
  ausfall:     { name: 'Ausfallschritte', cat: 'legs', cue: 'Großer Schritt nach vorn, hinteres Knie Richtung Boden, Oberkörper aufrecht. Seiten abwechseln.' },
  liegestuetz: { name: 'Liegestütz', cat: 'push', cue: 'Körper bildet eine Linie, Bauch fest. Zu schwer? Knie abstützen.' },
  plank:       { name: 'Plank', cat: 'core', cue: 'Unterarme am Boden, Körper gerade, Bauch und Gesäß fest. Nicht ins Hohlkreuz fallen.' },
  seitstuetz:  { name: 'Seitstütz', cat: 'core', switch: true, cue: 'Seitlich auf dem Unterarm, Hüfte hoch. Bei halber Zeit kommt das Signal zum Seitenwechsel.' },
  birddog:     { name: 'Bird Dog', cat: 'back', cue: 'Vierfüßler: gegenüberliegenden Arm und Bein strecken, Rücken ruhig. Seiten abwechseln.' },
  deadbug:     { name: 'Dead Bug', cat: 'core', cue: 'Rückenlage, Arme hoch, Knie 90°. Gegenüberliegenden Arm und Bein strecken, unterer Rücken bleibt am Boden.' },
  bridge:      { name: 'Glute Bridge', cat: 'back', cue: 'Rückenlage, Füße aufgestellt, Hüfte heben bis Schulter-Hüfte-Knie eine Linie sind, oben Gesäß anspannen.' },
  superman:    { name: 'Superman', cat: 'back', cue: 'Bauchlage, Arme und Beine leicht anheben, Nacken lang, kurz halten.' },
  hampel:      { name: 'Hampelmann', cat: 'cardio', cue: 'Gleichmäßiger Rhythmus, weich landen.' },
  kniehub:     { name: 'Hohe Knie', cat: 'cardio', cue: 'Knie abwechselnd auf Hüfthöhe, Oberkörper aufrecht, Bauch fest.' },
  skater:      { name: 'Skater', cat: 'cardio', cue: 'Seitliche Sprünge von Bein zu Bein, Oberkörper leicht nach vorn.' },
  kinn:        { name: 'Kinn einziehen', cat: 'neck', cue: 'Aufrecht, Kinn waagerecht nach hinten schieben (Doppelkinn), 5 s halten, lösen. Kein Nicken.' },
  schulterblatt: { name: 'Schulterblatt-Rückzug', cat: 'neck', cue: 'Ellbogen seitlich angewinkelt, Schulterblätter nach hinten-unten zusammenziehen, 3 s halten, Nacken lang.' },
  wallangel:   { name: 'Wall Angels', cat: 'neck', cue: 'Rücken, Kopf und Arme an der Wand, Arme langsam hoch und runter gleiten – nur so weit, wie es ohne Hohlkreuz geht.' },
  proney:      { name: 'Prone Y', cat: 'neck', cue: 'Bauchlage, Stirn knapp über dem Boden, Arme in Y-Form anheben, Daumen nach oben, Nacken lang.' },
  climber:     { name: 'Mountain Climber', cat: 'cardio', cue: 'Hochstütz, Knie abwechselnd zur Brust, Rücken gerade.' },
};
const WARM = [
  ['Armkreisen', 'Große Kreise vorwärts und rückwärts, Schultern lockern.'],
  ['Hüftkreisen', 'Hände in die Hüfte, große Kreise in beide Richtungen.'],
  ['Katze-Kuh', 'Vierfüßler: Rücken abwechselnd rund und hohl, langsam atmen.'],
];
const ORDER = {
  kraft: ['legs', 'push', 'back', 'core', 'legs', 'push', 'core', 'back'],
  fitness: ['legs', 'cardio', 'core', 'push', 'back', 'cardio', 'legs', 'core'],
  ausdauer: ['cardio', 'legs', 'cardio', 'core', 'cardio', 'push', 'cardio', 'back'],
};
const RATE = { work: 0.1, run: 0.15, rest: 0.03, warm: 0.05, cool: 0.04, prep: 0.02 }; // grobe kcal pro Sekunde

function pickExercises(n) {
  const order = ORDER[profile.focus] || ORDER.fitness, used = new Set(), out = [];
  for (let i = 0; i < n; i++) {
    let pool = Object.entries(EX).filter(([k, e]) => e.cat === order[i % order.length] && !used.has(k));
    if (!pool.length) pool = Object.entries(EX).filter(([k, e]) => !used.has(k) && (profile.neck || e.cat !== 'neck'));
    if (!pool.length) break;
    const [k, e] = pool[(TR.sessions + i) % pool.length];
    used.add(k); out.push(e);
  }
  if (profile.back) { // mindestens 2 Rücken/Core-Übungen
    const isB = e => BACK_RE.test(e.name);
    while (out.filter(isB).length < 2) {
      const spare = Object.values(EX).find(e => isB(e) && !out.includes(e));
      let idx = -1; for (let j = out.length - 1; j >= 0; j--) if (!isB(out[j])) { idx = j; break; }
      if (!spare || idx < 0) break;
      out[idx] = spare;
    }
  }
  if (profile.neck) { // mindestens 1 Nacken/Schulterblatt-Übung
    const isN = e => e.cat === 'neck', isB = e => BACK_RE.test(e.name);
    if (!out.some(isN)) {
      let idx = -1; for (let j = out.length - 1; j >= 0; j--) if (!isB(out[j])) { idx = j; break; }
      if (idx >= 0) out[idx] = Object.values(EX).filter(isN)[TR.sessions % 4];
    }
  }
  return out;
}

function buildPlan() {
  const mode = TR.mode, L = TR.lv[mode] || 0, steps = [], info = [];
  const S = (name, secs, kind, extra = {}) => steps.push({ name, secs, kind, ...extra });
  S('Mach dich bereit', 5, 'prep', { cue: 'Handy abstellen, Platz schaffen.' });
  if (mode === 'neck') {
    S('Schulterkreisen', 30, 'warm', { cue: 'Schultern langsam nach hinten kreisen, Nacken lang.' });
    const N = [
      [EX.kinn.name, 40, EX.kinn.cue], [EX.schulterblatt.name, 40, EX.schulterblatt.cue], [EX.wallangel.name, 45, EX.wallangel.cue],
      ['Nackendehnung seitlich', 40, 'Ohr sanft Richtung Schulter, Gegenschulter locker nach unten, kein Wippen. Bei halber Zeit Seite wechseln.', true],
      ['Brustdehnung (Türrahmen)', 40, 'Unterarm am Türrahmen, Schritt nach vorn, Brust öffnen, Schultern tief.'],
    ];
    N.forEach(([n, secs, cue, sw], i) => { S(n, secs, 'work', { cue, switch: sw }); if (i < N.length - 1) S('Kurz lösen', 10, 'rest', { cue: 'Schultern fallen lassen.' }); });
    info.push('Kinn einziehen · Schulterblatt-Rückzug · Wall Angels', 'Nacken- und Brustdehnung', 'Jeden Tag machbar, ideal an Bürotagen');
    return { mode, title: 'Nacken & Haltung', steps, info };
  }
  if (mode === 'run') {
    const run = 60 + 20 * L, walk = Math.max(60, 90 - 5 * L);
    const n = Math.max(2, Math.floor(([1200, 1800, 2400][TR.size] - 480) / (run + walk)));
    S('Zügig gehen', 300, 'warm', { cue: 'Locker einlaufen, Schultern lösen, Rumpf aufrecht.' });
    for (let i = 1; i <= n; i++) {
      S(`Laufen ${i}/${n}`, run, 'run', { cue: 'Gleichmäßig, du solltest noch sprechen können. Rumpf fest, Hüfte locker.' });
      if (i < n) S('Gehen', walk, 'rest', { cue: 'Atmung beruhigen.' });
    }
    S('Auslaufen', 180, 'cool', { cue: 'Langsam gehen, Puls runterfahren.' });
    info.push('5 min zügig gehen', `${n}× ${fmt(run)} laufen / ${fmt(walk)} gehen`, '3 min auslaufen');
    return { mode, title: `Lauf-Intervalle (${n} Runden)`, steps, info };
  }
  const work = 30 + 4 * Math.min(L, 5), rest = L >= 5 ? 15 : 20, rounds = 3 + (L >= 6 ? 1 : 0);
  const exs = pickExercises([4, 6, 8][TR.size]);
  const warm = profile.neck ? [['Schulterkreisen', 'Schultern langsam nach hinten kreisen, Nacken lang.'], ...WARM] : WARM;
  warm.forEach(([n, cue]) => S(n, 30, 'warm', { cue }));
  for (let r = 1; r <= rounds; r++) exs.forEach((e, i) => {
    S(e.name, work, 'work', { cue: e.cue, round: r, rounds, switch: e.switch });
    if (r === rounds && i === exs.length - 1) return;
    i === exs.length - 1 ? S('Pause (Runde geschafft)', rest + 25, 'rest', { cue: 'Trinken, Atmen.' }) : S('Pause', rest, 'rest', { cue: 'Locker bleiben.' });
  });
  if (profile.neck) {
    S('Nackendehnung seitlich', 40, 'cool', { cue: 'Ohr sanft Richtung Schulter, Gegenschulter locker nach unten. Bei halber Zeit Seite wechseln.', switch: true });
    S('Brustdehnung (Türrahmen)', 40, 'cool', { cue: 'Unterarm am Türrahmen, Schritt nach vorn, Brust öffnen, Schultern tief.' });
  }
  S('Kindshaltung', 45, 'cool', { cue: 'Knie am Boden, Gesäß Richtung Fersen, Arme nach vorn – entspannt den unteren Rücken.' });
  info.push(`${exs.length} Übungen × ${rounds} Runden`, `${work} s Belastung / ${rest} s Pause`, exs.map(e => e.name).join(' · '), `Aufwärmen ${warm.length * 30} s + Dehnen`);
  if (profile.neck) info.push('🛡 Nacken-Schutz: Schulterblatt-Übung + Nackendehnung eingebaut');
  if (profile.back) info.push('🛡 Rücken-Schutz: mindestens 2 Rücken/Core-Übungen eingebaut');
  return { mode, title: `Zuhause · ${exs.length} Übungen`, steps, info };
}

let run = null;
const cur = () => run.plan.steps[run.i];

function beep(freq = 880, dur = 0.12) {
  try {
    const c = run.actx, o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq; g.gain.value = 0.25; o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur);
  } catch {}
  try { navigator.vibrate && navigator.vibrate(dur * 1000); } catch {}
}

function credit(s, secs, full) {
  run.elapsed += secs; run.kcal += (RATE[s.kind] || 0) * secs;
  if (full && s.kind === 'work') { const o = run.sets[s.name] ||= { sets: 0, secs: s.secs }; o.sets++; }
}

function advance(credited) {
  const s = cur();
  if (credited) credit(s, s.secs, true);
  if (run.i + 1 >= run.plan.steps.length) return false;
  run.i++; run.half = false; run.lastBeep = 0;
  return true;
}

function startSession() {
  const plan = buildPlan(), AC = window.AudioContext || window.webkitAudioContext;
  run = { plan, i: 0, paused: false, half: false, lastBeep: 0, elapsed: 0, kcal: 0, sets: {}, drawn: -1, actx: AC ? new AC() : null };
  try { run.actx && run.actx.resume(); } catch {}
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { if (run) run.wake = l; }).catch(() => {}); } catch {}
  run.end = Date.now() + cur().secs * 1000;
  document.querySelector('nav').classList.add('hidden');
  buildRunView(); beep(1200, 0.25);
  run.timer = setInterval(tick, 250);
}

function buildRunView() {
  const s = cur(), steps = run.plan.steps;
  const nxt = steps.slice(run.i + 1).find(x => x.kind !== 'rest');
  const label = s.rounds ? `Runde ${s.round}/${s.rounds}` : ({ warm: 'Aufwärmen', cool: 'Abkühlen', prep: 'Gleich geht’s los', rest: 'Pause', run: 'Laufen' }[s.kind] || '');
  run.drawn = run.i;
  $('#view').innerHTML = `
  <div class="card run ${s.kind === 'work' || s.kind === 'run' ? 'run-work' : 'run-rest'}">
    <div class="muted" style="text-align:center">${label} · Schritt ${run.i + 1}/${steps.length}</div>
    <div class="runname">${esc(s.name)}</div>
    ${dialSvg(s.kind === 'work' || s.kind === 'run')}
    <div class="warn" id="sw" style="text-align:center;min-height:1.4em;font-weight:600"></div>
    <p class="muted">${esc(s.cue || '')}</p>
    <p class="muted">${nxt ? 'Als Nächstes: <b>' + esc(nxt.name) + '</b>' : 'Letzter Schritt!'}</p>
    <div class="row">
      <button id="pause">${run.paused ? '▶ Weiter' : '⏸ Pause'}</button>
      <button id="skip">⏭ Weiter</button>
      <button id="stop">⏹ Ende</button>
    </div>
  </div>`;
  $('#pause').onclick = () => {
    if (run.paused) { run.end = Date.now() + run.rem; run.paused = false; }
    else { run.rem = run.end - Date.now(); run.paused = true; }
    buildRunView();
  };
  $('#skip').onclick = () => { if (advance(false)) { run.end = Date.now() + cur().secs * 1000; run.paused = false; beep(1200, 0.2); buildRunView(); } else finishSession(); };
  $('#stop').onclick = () => { if (confirm('Training beenden?')) finishSession(true); };
  updateClock(run.paused ? run.rem : run.end - Date.now(), s);
}

// Analoges Ziffernblatt: Sekundenzeiger läuft im Uhrzeigersinn, der Ring zeigt die verbleibende Zeit des Schritts
const CIRC = 2 * Math.PI * 86;
function dialSvg(work) {
  let t = '';
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = 76, r2 = big ? 68 : 71;
    t += `<line class="tick ${big ? 'big' : ''}" x1="${100 + r1 * Math.sin(a)}" y1="${100 - r1 * Math.cos(a)}" x2="${100 + r2 * Math.sin(a)}" y2="${100 - r2 * Math.cos(a)}"/>`;
    if (big) t += `<text class="num" x="${100 + 58 * Math.sin(a)}" y="${100 - 58 * Math.cos(a)}">${i === 0 ? 60 : i}</text>`;
  }
  return `<svg class="dial ${work ? 'work' : ''}" viewBox="0 0 200 200" role="img" aria-label="Timer">
    <circle class="face" cx="100" cy="100" r="96"/>
    <circle class="track" cx="100" cy="100" r="86"/>
    <circle class="arc" id="arc" cx="100" cy="100" r="86" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/>
    ${t}
    <text class="digi" id="clock" x="100" y="138">0:00</text>
    <g id="hand"><line class="hand" x1="100" y1="112" x2="100" y2="34"/></g>
    <circle class="hub" cx="100" cy="100" r="5"/>
  </svg>`;
}

function updateClock(remMs, s) {
  const c = $('#clock'); if (!c) return;
  remMs = Math.max(0, Math.min(s.secs * 1000, remMs));
  c.textContent = fmt(Math.ceil(remMs / 1000));
  $('#arc').style.strokeDashoffset = CIRC * (1 - remMs / (s.secs * 1000));
  $('#hand').setAttribute('transform', `rotate(${((s.secs * 1000 - remMs) / 1000 % 60) * 6} 100 100)`);
}

function tick() {
  if (!run || run.paused) return;
  const now = Date.now();
  while (now >= run.end) {
    if (!advance(true)) return finishSession();
    run.end += cur().secs * 1000; beep(1200, 0.25);
  }
  if (run.drawn !== run.i) buildRunView();
  const s = cur(), rem = Math.ceil((run.end - now) / 1000);
  if (rem > 0 && rem <= 3 && rem !== run.lastBeep) { run.lastBeep = rem; beep(700, 0.08); }
  if (s.switch && !run.half && rem <= s.secs / 2) { run.half = true; beep(1000, 0.3); const sw = $('#sw'); if (sw) sw.textContent = '↔ Seite wechseln!'; }
  updateClock(run.end - now, s);
}

document.addEventListener('visibilitychange', () => {
  if (!run || document.hidden) return;
  try { navigator.wakeLock && navigator.wakeLock.request('screen').then(l => { if (run) run.wake = l; }).catch(() => {}); } catch {}
  tick();
});

function finishSession(early) {
  const r = run; clearInterval(r.timer);
  try { r.wake && r.wake.release(); } catch {}
  if (early) { const s = cur(), left = Math.max(0, Math.ceil((r.paused ? r.rem : r.end - Date.now()) / 1000)); credit(s, s.secs - left, false); }
  const leave = tab => { run = null; document.querySelector('nav').classList.remove('hidden'); render(tab); };
  if (r.elapsed < 60) {
    $('#view').innerHTML = `<div class="card"><h2>Das war sehr kurz</h2><p class="muted">Unter einer Minute speichere ich nichts.</p><button class="primary" id="back">Zurück</button></div>`;
    $('#back').onclick = () => leave('trainer'); return;
  }
  const mins = Math.max(1, Math.round(r.elapsed / 60));
  $('#view').innerHTML = `
  <div class="card">
    <h2>${early ? 'Training beendet' : '🎉 Geschafft!'}</h2>
    <p class="muted">${esc(r.plan.title)} · ${mins} min aktive Zeit</p>
    <label>Kalorien (grobe Schätzung – gern anpassen)</label><input type="number" id="kc" min="0" value="${Math.round(r.kcal)}">
    <label>Wie war es?</label>
    <select id="rate"><option value="easy">Zu leicht</option><option value="ok" selected>Passt</option><option value="hard">Zu schwer</option></select>
    <label>Notiz (z.B. Rücken)</label><input id="tnote">
    <p class="row"><button class="primary" id="saveT">Speichern</button><button id="drop">Verwerfen</button></p>
  </div>`;
  $('#drop').onclick = () => leave('trainer');
  $('#saveT').onclick = () => {
    const rate = $('#rate').value, mode = r.plan.mode, note = $('#tnote').value.trim();
    workouts.push({
      id: Date.now(), date: today(), type: mode === 'run' ? 'cardio' : 'kraft', minutes: mins, kcal: +$('#kc').value || 0,
      exercises: Object.entries(r.sets).map(([name, v]) => ({ name, sets: v.sets, reps: v.secs, weight: 0, unit: 's' })),
      note: ['Trainer: ' + r.plan.title + (early ? ' (vorzeitig beendet)' : ''), note].filter(Boolean).join(' · '),
    });
    TR.sessions++;
    let lv = TR.lv[mode] || 0;
    if (mode !== 'neck') {
    if (rate === 'easy') { lv++; TR.streak[mode] = 0; }
    else if (rate === 'hard') { lv--; TR.streak[mode] = 0; }
    else if (!early && ++TR.streak[mode] >= 2) { lv++; TR.streak[mode] = 0; }
    TR.lv[mode] = Math.max(0, Math.min(10, lv));
    }
    saveTR(); save(); leave('log');
  };
}

function viewTrainer() {
  const plan = buildPlan(), total = plan.steps.reduce((a, s) => a + s.secs, 0);
  $('#view').innerHTML = `
  ${profile.neck === undefined ? `<div class="card"><h2>Nacken auch berücksichtigen?</h2><p class="muted">Dann baue ich Schulterblatt-Übungen und Nackendehnung in dein Training ein.</p><div class="row"><button class="primary" id="neckYes">Ja</button><button id="neckNo">Nein</button></div></div>` : ''}
  <div class="card">
    <h2>🧑‍🏫 Dein Trainer</h2>
    <div class="row">
      <div><label>Training</label><select id="mode"><option value="home">Zuhause (Körpergewicht)</option><option value="run">Lauf-Intervalle</option><option value="neck">Nacken &amp; Haltung (5 min)</option></select></div>
      <div><label>Länge</label><select id="size" ${TR.mode === 'neck' ? 'disabled' : ''}>${SIZES.map((s, i) => `<option value="${i}">${s}</option>`).join('')}</select></div>
    </div>
    <p class="muted">Du brauchst nur dein Handy und etwas Platz. ${TR.mode === 'neck' ? '' : 'Level ' + (TR.lv[TR.mode] || 0) + '/10 · '}Ziel ${profile.freq}× pro Woche · Fokus ${FOCUS[profile.focus]}.</p>
  </div>
  <div class="card">
    <h2>${esc(plan.title)}</h2>
    <div class="stat">≈ ${Math.round(total / 60)} min</div>
    <ul>${plan.info.map(l => `<li>${esc(l)}</li>`).join('')}</ul>
    <button class="primary" id="go" style="width:100%;padding:14px">▶ Start</button>
  </div>
  <div class="card muted">Nach dem Training sagst du, wie es war: <b>zu leicht</b> → nächstes Mal mehr, <b>zu schwer</b> → weniger, <b>passt</b> zweimal → Steigerung. Das ist dein automatisches Progressive Overload. Beim Start geht der Ton an und der Bildschirm bleibt wach.</div>`;
  $('#mode').value = TR.mode; $('#size').value = TR.size;
  $('#mode').onchange = e => { TR.mode = e.target.value; saveTR(); viewTrainer(); };
  $('#size').onchange = e => { TR.size = +e.target.value; saveTR(); viewTrainer(); };
  $('#go').onclick = startSession;
  if ($('#neckYes')) { $('#neckYes').onclick = () => { profile.neck = true; save(); viewTrainer(); }; $('#neckNo').onclick = () => { profile.neck = false; save(); viewTrainer(); }; }
}

// ---------- Ernährung ----------
let foodDate = today();
const GOALS = { cut: ['Abnehmen', -500], hold: ['Gewicht halten', 0], bulk: ['Muskelaufbau', 300] };
const hasBody = () => profile.age && profile.height && profile.weight && profile.sex;
// Mifflin-St-Jeor-Grundumsatz × 1,2 (Alltag ohne Sport); Training kommt tageweise dazu
const baseKcal = () => {
  const bmr = 10 * profile.weight + 6.25 * profile.height - 5 * profile.age + (profile.sex === 'm' ? 5 : -161);
  const floor = profile.sex === 'm' ? 1500 : 1200;
  return Math.round(Math.max(floor, bmr * 1.2 + GOALS[profile.goal || 'hold'][1]));
};
const burnedOn = d => workouts.filter(w => w.date === d).reduce((a, w) => a + (w.kcal || 0), 0);
const dayBudget = d => baseKcal() + burnedOn(d);
const eatenOn = d => foods.filter(f => f.date === d);
const sumF = (arr, k) => arr.reduce((a, f) => a + (+f[k] || 0), 0);

function viewFood() {
  const sel = (id, opts, v) => `<select id="${id}">${opts.map(([k, l]) => `<option value="${k}" ${k == v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  if (!hasBody()) {
    $('#view').innerHTML = `
    <div class="card">
      <h2>🍽 Erst kurz zu dir</h2>
      <p class="muted">Damit ich deinen Tagesbedarf schätzen kann (Grundumsatz + Alltag + Training). Die Daten bleiben nur auf deinem Gerät.</p>
      <div class="row"><div><label>Geschlecht</label>${sel('sex', [['m', 'männlich'], ['w', 'weiblich']], profile.sex || 'm')}</div>
        <div><label>Alter</label><input type="number" id="age" min="14" max="99" value="${profile.age || ''}"></div></div>
      <div class="row"><div><label>Größe (cm)</label><input type="number" id="height" min="120" max="230" value="${profile.height || ''}"></div>
        <div><label>Gewicht (kg)</label><input type="number" id="weight" min="35" max="250" step="0.1" value="${profile.weight || ''}"></div></div>
      <label>Ziel</label>${sel('goal', Object.entries(GOALS).map(([k, v]) => [k, v[0]]), profile.goal || 'hold')}
      <p><button class="primary" id="saveBody">Speichern</button></p>
      <p class="muted">Schätzwerte, keine medizinische Beratung.</p>
    </div>`;
    $('#saveBody').onclick = () => {
      const b = { sex: $('#sex').value, age: +$('#age').value, height: +$('#height').value, weight: +$('#weight').value, goal: $('#goal').value };
      if (!b.age || !b.height || !b.weight) return alert('Bitte Alter, Größe und Gewicht ausfüllen.');
      Object.assign(profile, b); save(); viewFood();
    };
    return;
  }
  const list = eatenOn(foodDate), eaten = sumF(list, 'kcal'), prot = sumF(list, 'protein');
  const burned = burnedOn(foodDate), budget = dayBudget(foodDate), left = budget - eaten;
  const pct = Math.min(100, Math.round(eaten / budget * 100));
  const recents = {}; [...foods].sort((a, b) => a.id - b.id).forEach(f => recents[f.name] = f);
  const days = Array.from({ length: 7 }, (_, i) => addDays(foodDate, i - 6));
  $('#view').innerHTML = `
  <div class="card">
    <div class="row"><button id="fprev">←</button><div style="text-align:center;flex:3"><b>${foodDate === today() ? 'Heute' : foodDate}</b></div><button id="fnext">→</button></div>
  </div>
  <div class="card">
    <div class="row">
      <div><div class="stat">${eaten}</div><div class="muted">gegessen</div></div>
      <div><div class="stat ${left < 0 ? 'warn' : 'ok'}">${left}</div><div class="muted">${left < 0 ? 'drüber' : 'übrig'}</div></div>
      <div><div class="stat">${budget}</div><div class="muted">Budget</div></div>
    </div>
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="muted">Budget = ${baseKcal()} kcal (Grundumsatz + Alltag, Ziel ${GOALS[profile.goal || 'hold'][0]}) + ${burned} kcal Training. Eiweiß: ${prot} g (Richtwert ~${Math.round(profile.weight * 1.6)} g).</div>
  </div>
  <div class="card">
    <h2>Essen hinzufügen</h2>
    <label>Was?</label><input id="fname" list="flist" placeholder="z.B. Haferflocken mit Milch" autocomplete="off">
    <datalist id="flist">${Object.keys(recents).map(n => `<option value="${esc(n)}">`).join('')}</datalist>
    <div class="row"><div><label>kcal</label><input type="number" id="fkcal" min="0"></div><div><label>Eiweiß (g, optional)</label><input type="number" id="fprot" min="0"></div></div>
    <p><button class="primary" id="fadd">Hinzufügen</button></p>
  </div>
  <div class="card"><h2>Gegessen</h2>${list.length ? list.map(f => `<div class="entry"><b>${esc(f.name)}</b> · ${f.kcal} kcal${f.protein ? ' · ' + f.protein + ' g Eiweiß' : ''}
    <button data-fdel="${f.id}" style="float:right;margin-top:-4px">🗑</button></div>`).join('') : '<p class="muted">Noch nichts eingetragen.</p>'}</div>
  <div class="card"><h2>Letzte 7 Tage</h2>${days.map(d => { const e = sumF(eatenOn(d), 'kcal'); return `<div class="entry"><b>${d.slice(5)}</b> · ${e ? e + ' / ' + dayBudget(d) + ' kcal' : '<span class="muted">–</span>'}</div>`; }).join('')}
    <p><button id="editBody">Körperdaten / Ziel ändern</button></p></div>`;
  $('#fprev').onclick = () => { foodDate = addDays(foodDate, -1); viewFood(); };
  $('#fnext').onclick = () => { foodDate = addDays(foodDate, 1); viewFood(); };
  $('#fname').onchange = () => { const r = recents[$('#fname').value]; if (r) { $('#fkcal').value = r.kcal; $('#fprot').value = r.protein || ''; } };
  $('#fadd').onclick = () => {
    const name = $('#fname').value.trim(), kcal = +$('#fkcal').value;
    if (!name || !kcal) return alert('Bitte Name und kcal angeben.');
    foods.push({ id: Date.now(), date: foodDate, name, kcal, protein: +$('#fprot').value || 0 }); save(); viewFood();
  };
  document.querySelectorAll('[data-fdel]').forEach(b => b.onclick = () => { foods = foods.filter(f => f.id != b.dataset.fdel); save(); viewFood(); });
  $('#editBody').onclick = () => { delete profile.age; save(); viewFood(); };
}

document.querySelector('nav').onclick = e => e.target.dataset.tab && render(e.target.dataset.tab);
render();
</script>
</body>
</html>
